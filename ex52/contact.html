<html>
    <head>
        <meta charset="UTF-8">
        <title>Contact - GET Method</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>         
        <form action="result.html" method="GET">
            <div>
                <label for="fullName">Full name</label>
                <input type="text" id="fullName" name="fullName">
            </div>
                
            <div>
                <label for="email">Email</label>
                <input type="text" id="email" name="email">
            </div>
            <div>
                <label for="sendTo">Send to</label>
                <select id="sendTo" name="sendTo">
                    <option value="Editorial board">Editorial board</option>
                    <option value="News Department">News Department</option>
                    <option value="Board of Perspectives">Board of Perspectives</option>
                    <option value="World Board">World Board</option>
                    <option value="Business Department">Business Department</option>
                    </select>
            </div>

            <div>
                <label for="title">Title</label>
                <input type="text" id="title" name="title">
            </div>

            <div>
                <label for="content">Content</label>
                <textarea id="content" name="content"></textarea>
            </div>

            <div>
                <input type="submit" value="Send">
            </div>
        </form>
    </body>
</html>
